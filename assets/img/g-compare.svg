<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Comparison chart with a magnifier over the leading option">
  <defs>
    <linearGradient id="c1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="cBlob" x1="0" y1="0" x2="1" y2="1">
