<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PickInbox og-cover source</title>
<!-- Rendered to assets/img/og-cover.png (1200x630) with Edge headless:
     msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630
            --screenshot=../og-cover.png og-cover.html
     Kept in the repo so the social banner is reproducible, not a lost artefact. -->
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#0b1220;color:#fff;position:relative}
  .glow{position:absolute;border-radius:50%}
  .g1{width:760px;height:760px;right:-220px;top:-300px;
      background:radial-gradient(circle,rgba(37,99,235,.85),rgba(37,99,235,0) 66%)}
  .g2{width:620px;height:620px;left:-240px;bottom:-320px;
      background:radial-gradient(circle,rgba(6,182,212,.65),rgba(6,182,212,0) 66%)}
  .inner{position:relative;height:100%;padding:54px 68px 48px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;
         letter-spacing:-.02em}
  .mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#06b6d4);
        display:grid;place-items:center;font-size:27px}
  .brand em{font-style:normal;color:#7dd3fc}
  h1{font-size:52px;line-height:1.1;letter-spacing:-.03em;margin-top:44px;max-width:21ch}
  h1 u{text-decoration:none;background:linear-gradient(90deg,#60a5fa,#22d3ee);
      -webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin-top:20px;font-size:23px;color:#b9c4d4;max-width:38ch}
  .row{margin-top:42px;display:flex;align-items:center;gap:13px}
  .tile{width:68px;height:68px;border-radius:19px;display:grid;place-items:center;
        font-weight:800;font-size:22px}
  .k{background:linear-gradient(135deg,#2563eb,#3b82f6)}
  .gr{background:linear-gradient(135deg,#7c3aed,#a855f7)}
  .ml{background:linear-gradient(135deg,#0f766e,#2dd4bf)}
  .aw{background:linear-gradient(135deg,#b45309,#f59e0b)}
  .os{background:linear-gradient(135deg,#be123c,#fb7185)}
  .tag{margin-left:auto;font-size:20px;color:#8fa0b8;text-align:right;line-height:1.4}
  .tag b{color:#fff;display:block;font-size:24px}
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="inner">
    <div class="brand"><span class="mark">✉</span>Pick<em>Inbox</em></div>
    <h1>Pick the right email platform — <u>without the upsell noise</u></h1>
    <p>Billing unit, automation ceiling, deliverability, and what leaving really costs.</p>
    <div class="row">
      <span class="tile k">K</span>
      <span class="tile gr">GR</span>
      <span class="tile ml">ML</span>
      <span class="tile aw">AW</span>
      <span class="tile os">OS</span>
      <span class="tag"><b>5 platforms compared</b>independent notes · no paid placements</span>
    </div>
  </div>
</body>
</html>
