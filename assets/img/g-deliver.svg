    <rect x="960" y="188" width="180" height="52" rx="14" fill="#fff" stroke="#e3e8ef"/>
    <text x="986" y="221" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="19"
          font-weight="700" fill="#0b1220">DMARC</text>
