<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Two platforms facing each other across a versus badge">
  <defs>
    <linearGradient id="dBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="dViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".04"/>
    </linearGradient>
    <filter id="dSoft" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1220" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="none"/>
  <circle cx="600" cy="60" r="260" fill="url(#dBlob)"/>

  <g filter="url(#dSoft)">
    <rect x="120" y="66" width="392" height="196" rx="24" fill="#fff" stroke="#e3e8ef"/>
    <rect x="152" y="98" width="72" height="72" rx="20" fill="url(#dBlue)"/>
    <text x="188" y="146" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="38"
          font-weight="700" fill="#fff" text-anchor="middle">K</text>
    <rect x="152" y="192" width="220" height="12" rx="6" fill="#c9d5e6"/>
    <rect x="152" y="216" width="160" height="12" rx="6" fill="#e2e9f3"/>
    <rect x="152" y="240" width="188" height="12" rx="6" fill="#e2e9f3"/>
  </g>

  <g filter="url(#dSoft)">
    <rect x="688" y="66" width="392" height="196" rx="24" fill="#fff" stroke="#e3e8ef"/>
    <rect x="720" y="98" width="72" height="72" rx="20" fill="url(#dViolet)"/>
    <text x="756" y="146" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="34"
          font-weight="700" fill="#fff" text-anchor="middle">GR</text>
    <rect x="720" y="192" width="240" height="12" rx="6" fill="#c9d5e6"/>
    <rect x="720" y="216" width="180" height="12" rx="6" fill="#e2e9f3"/>
    <rect x="720" y="240" width="206" height="12" rx="6" fill="#e2e9f3"/>
  </g>

  <g filter="url(#dSoft)">
    <circle cx="600" cy="164" r="52" fill="#0b1220"/>
    <text x="600" y="178" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="30"
          font-weight="700" fill="#fff" text-anchor="middle">VS</text>
  </g>
</svg>
