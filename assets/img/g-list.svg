<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Growing stack of subscriber cards with an upward trend line">
  <defs>
    <linearGradient id="lTeal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="lBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".03"/>
    </linearGradient>
    <filter id="lSoft" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1220" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="none"/>
  <circle cx="300" cy="90" r="230" fill="url(#lBlob)"/>

  <g filter="url(#lSoft)">
    <rect x="150" y="200" width="300" height="72" rx="18" fill="#fff" stroke="#e3e8ef"/>
    <circle cx="188" cy="236" r="16" fill="#dbe6f7"/>
    <rect x="216" y="222" width="150" height="11" rx="5" fill="#c9d5e6"/>
    <rect x="216" y="242" width="96" height="11" rx="5" fill="#e2e9f3"/>

    <rect x="196" y="140" width="300" height="72" rx="18" fill="#fff" stroke="#e3e8ef"/>
    <circle cx="234" cy="176" r="16" fill="#bfe7e0"/>
    <rect x="262" y="162" width="168" height="11" rx="5" fill="#c9d5e6"/>
    <rect x="262" y="182" width="104" height="11" rx="5" fill="#e2e9f3"/>

    <rect x="242" y="80" width="300" height="72" rx="18" fill="#fff" stroke="#e3e8ef"/>
    <circle cx="280" cy="116" r="16" fill="url(#lTeal)"/>
    <path d="M274 116l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="308" y="102" width="132" height="11" rx="5" fill="#c9d5e6"/>
    <rect x="308" y="122" width="84" height="11" rx="5" fill="#e2e9f3"/>
  </g>

  <g filter="url(#lSoft)">
    <rect x="640" y="60" width="420" height="200" rx="24" fill="#fff" stroke="#e3e8ef"/>
    <path d="M692 214l80-58 72 30 96-96" fill="none" stroke="url(#lTeal)" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="940" cy="90" r="12" fill="#0f766e"/>
    <path d="M912 96l26-6-6 26" fill="none" stroke="#0f766e" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="692" y="96" width="120" height="12" rx="6" fill="#c9d5e6"/>
    <rect x="692" y="118" width="76" height="12" rx="6" fill="#e2e9f3"/>
  </g>
